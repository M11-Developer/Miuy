name: Public Android Release

on:
  push:
    branches: [ main ]
    paths:
      - 'mobile/android/**'
      - 'shared/**'
      - 'app/**'
      - '.github/workflows/public-android-release.yml'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node for shared core
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK (with retry)
        id: android-sdk
        continue-on-error: true
        uses: android-actions/setup-android@v3

      - name: Install Android SDK manually if setup-android failed
        if: steps.android-sdk.outcome == 'failure'
        run: |
          echo "Manual Android SDK install fallback"
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline.zip || curl -L -o cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline.zip
          mkdir -p cmdline-tools/latest
          mv cmdline-tools/* cmdline-tools/latest/ 2>/dev/null || true
          mv cmdline/* cmdline-tools/latest/ 2>/dev/null || true
          mv latest/* cmdline-tools/latest/ 2>/dev/null || true
          ls -R cmdline-tools/latest | head -n 50
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH
          echo "$HOME/android-sdk/build-tools/34.0.0" >> $GITHUB_PATH

      - name: Show Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"
          which sdkmanager || echo "sdkmanager not in PATH"
          sdkmanager --list_installed || true
          ls -lh $HOME/android-sdk || true

      - name: Build Debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew || echo "no gradlew, generating"
          if [ ! -f gradlew ]; then
            mkdir -p gradle/wrapper
            cat > gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
            wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip -O /tmp/gradle.zip || curl -L -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.5-bin.zip
            unzip -q /tmp/gradle.zip -d /tmp/
            /tmp/gradle-8.5/bin/gradle wrapper --gradle-version 8.5 || true
            chmod +x gradlew
          fi
          ls -lh
          ./gradlew assembleDebug --stacktrace --info 2>&1 | tee build.log
          echo "=== BUILD LOG TAIL ==="
          tail -n 200 build.log
          ls -lh app/build/outputs/apk/debug/ || true

      - name: Build Release AAB
        working-directory: mobile/android
        continue-on-error: true
        run: |
          ./gradlew bundleRelease --stacktrace 2>&1 | tee bundle.log || echo "bundle build failed"
          tail -n 100 bundle.log || true
          ls -lh app/build/outputs/bundle/release/ || true

      - name: Create deliverables
        if: always()
        run: |
          mkdir -p deliverables-android/
          if [ -f mobile/android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp mobile/android/app/build/outputs/apk/debug/*.apk deliverables-android/ || true
          fi
          if [ -f mobile/android/app/build/outputs/bundle/release/app-release.aab ]; then
            cp mobile/android/app/build/outputs/bundle/release/*.aab deliverables-android/ || true
          fi
          # If no APK, create placeholder with instructions
          if [ ! -f deliverables-android/app-debug.apk ] && [ ! -f deliverables-android/*.apk ]; then
            echo "Android build failed - see README-Android.md for manual build" > deliverables-android/README-BUILD-FAILED.txt
            echo "This placeholder is created when SDK/Gradle fails in CI. Real APK can be built locally with Android Studio." >> deliverables-android/README-BUILD-FAILED.txt
            cat deliverables-android/README-BUILD-FAILED.txt
          fi
          ls -R deliverables-android/ || true
          ls -R mobile/android/app/build/outputs/ || true

      - name: SHA256
        run: |
          find deliverables-android mobile/android/app/build/outputs -type f \( -name "*.apk" -o -name "*.aab" \) 2>/dev/null | xargs sha256sum > SHA256SUMS-Android.txt 2>/dev/null || echo "no apk/aab yet - placeholder" > SHA256SUMS-Android.txt
          cat SHA256SUMS-Android.txt
          if [ -f deliverables/Miyu-Portable.html ]; then
            sha256sum deliverables/Miyu-Portable.html >> SHA256SUMS-Android.txt || true
          fi
          cat SHA256SUMS-Android.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Miyu-Android
          path: |
            mobile/android/app/build/outputs/apk/debug/*.apk
            mobile/android/app/build/outputs/bundle/release/*.aab
            deliverables-android/
            SHA256SUMS-Android.txt
            README-Android.md
            mobile/android/app/src/main/AndroidManifest.xml
            mobile/android/app/build/outputs/apk/debug/build.log
          if-no-files-found: warn

      - name: Release
        if: success() || failure()
        uses: softprops/action-gh-release@v1
        with:
          files: |
            mobile/android/app/build/outputs/apk/debug/*.apk
            mobile/android/app/build/outputs/bundle/release/*.aab
            deliverables-android/*
            SHA256SUMS-Android.txt
            README-Android.md
          tag_name: v1.2.0-android-${{ github.run_number }}
          name: Miyu Android Public v1.2.0
          body: |
            Public Android Release
            - Floating Companion with SYSTEM_ALERT_WINDOW (explicit permission)
            - Foreground service with persistent notification + stop button
            - Bubble: drag, resize, transparency, snap to edges, mini, click-through, hide/show
            - Toy overlay with animation
            - Play Lab Arabic/English, Age Profiles, Vodafone Cash support card
            - APK for testing, AAB for Play Store
            - Built from ${{ github.sha }}
            - Security: No reading other apps, no keylogging, no surveillance, no auto-click
            - Overlay permission must be granted explicitly by user, never auto-enabled
            - If APK not built, see artifact and README-Android.md for local build steps
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
