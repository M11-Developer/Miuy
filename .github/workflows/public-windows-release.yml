name: Public Windows Release

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'desktop/**'
      - 'public/**'
      - 'tools/**'
      - 'package.json'
      - 'index.html'
      - 'vite.config.js'
      - '.github/workflows/public-windows-release.yml'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: desktop/go.mod

      - name: npm ci
        run: npm ci

      - name: Build web
        run: npm run build

      - name: Build portable
        run: npm run build:portable

      - name: Go mod tidy
        working-directory: desktop
        run: |
          go mod tidy -v
          cat go.mod

      - name: Generate Windows resources
        working-directory: desktop
        run: go run ./resourcegen

      - name: Build Windows EXE
        working-directory: desktop
        run: |
          go build -trimpath -ldflags="-s -w -H windowsgui -X main.ownerBuildID=public-${{ github.sha }} -X main.AppVersion=1.2.0" -o ../Miyu.exe .
          dir ..\Miyu.exe
          if (!(Test-Path ..\Miyu.exe)) { throw "Miyu.exe not built" }

      - name: Create deliverables and ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path deliverables | Out-Null
          Copy-Item Miyu.exe deliverables/ -Force
          if (Test-Path Miyu-Portable.html) { Copy-Item Miyu-Portable.html deliverables/Miyu-Portable.html -Force }
          elseif (Test-Path deliverables/Miyu-Portable.html) { Write-Host "Portable already in deliverables" }
          else { Write-Host "Portable not found, checking root" ; Get-ChildItem -Recurse -Filter "*Portable*.html" | Select-Object -First 5 }
          Get-ChildItem deliverables/
          # Create ZIP with both files if present
          $files = @("deliverables/Miyu.exe")
          if (Test-Path "deliverables/Miyu-Portable.html") { $files += "deliverables/Miyu-Portable.html" }
          Compress-Archive -Path $files -DestinationPath Miyu-Windows.zip -Force
          Get-ChildItem Miyu-Windows.zip
          # Verify PE32+
          $bytes = [System.IO.File]::ReadAllBytes("Miyu.exe")
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "Not MZ executable" }
          Write-Host "MZ header OK"
          # Check PE32+ (0x20b)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          $magic = [BitConverter]::ToUInt16($bytes, $peOffset + 24)
          if ($magic -eq 0x20b) { Write-Host "PE32+ confirmed (64-bit)" } else { Write-Host "PE magic $magic (not 0x20b) but still PE" }

      - name: SHA256
        shell: pwsh
        run: |
          $hashExe = (Get-FileHash Miyu.exe -Algorithm SHA256).Hash
          $hashZip = (Get-FileHash Miyu-Windows.zip -Algorithm SHA256).Hash
          "$hashExe  Miyu.exe" | Out-File SHA256SUMS.txt
          "$hashZip  Miyu-Windows.zip" | Out-File -Append SHA256SUMS.txt
          if (Test-Path deliverables/Miyu-Portable.html) {
            $hashPortable = (Get-FileHash deliverables/Miyu-Portable.html -Algorithm SHA256).Hash
            "$hashPortable  Miyu-Portable.html" | Out-File -Append SHA256SUMS.txt
          }
          cat SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Miyu-Windows
          path: |
            Miyu.exe
            Miyu-Windows.zip
            SHA256SUMS.txt
            deliverables/Miyu-Portable.html

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            Miyu.exe
            Miyu-Windows.zip
            SHA256SUMS.txt
            deliverables/Miyu-Portable.html
          tag_name: v1.2.0-windows-${{ github.run_number }}
          name: Miyu Windows Public v1.2.0
          body: |
            Public Windows Release
            - Miyu.exe WebView2 Go backend embed UI, PE32+ verified
            - Miyu-Portable.html fallback
            - SHA256
            - Built from ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
