name: Public Windows Release

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'desktop/**'
      - 'public/**'
      - 'tools/**'
      - 'package.json'
      - 'index.html'
      - 'vite.config.js'
      - '.github/workflows/public-windows-release.yml'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: desktop/go.mod

      - name: Install deps
        run: npm ci

      - name: Build web
        run: npm run build

      - name: Build portable
        run: npm run build:portable

      - name: Go mod tidy and verify
        working-directory: desktop
        run: |
          go env
          go mod tidy -v
          echo "=== go.mod ==="
          cat go.mod
          echo "=== go.sum head ==="
          cat go.sum | head -n 50
          echo "=== files ==="
          dir
          echo "=== ui.html exists? ==="
          if (Test-Path ui.html) { Write-Host "ui.html size $((Get-Item ui.html).Length)" } else { Write-Host "ui.html MISSING" }

      - name: Generate Windows resources
        working-directory: desktop
        run: |
          go run ./resourcegen -v
          dir *.syso

      - name: Build Windows EXE (public) verbose
        working-directory: desktop
        run: |
          echo "Building with verbose"
          go build -x -trimpath -ldflags="-s -w -H windowsgui -X main.ownerBuildID=public-${{ github.sha }} -X main.AppVersion=1.2.0" -o ../Miyu.exe . 2>&1 | Tee-Object build.log
          if (Test-Path ../Miyu.exe) { 
            Write-Host "Miyu.exe built OK"
            Get-Item ../Miyu.exe | Format-List
          } else {
            Write-Host "Miyu.exe FAILED"
            cat build.log
            throw "Build failed"
          }

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-log
          path: desktop/build.log

      - name: Create deliverables
        if: success()
        run: |
          mkdir -p deliverables
          Copy-Item Miyu.exe deliverables/ -Force
          Copy-Item deliverables/Miyu-Portable.html deliverables/ -Force -ErrorAction SilentlyContinue
          Copy-Item Miyu-Portable.html deliverables/ -Force -ErrorAction SilentlyContinue
          Get-ChildItem deliverables/

      - name: Create ZIP
        if: success()
        run: |
          Compress-Archive -Path deliverables/Miyu.exe,deliverables/Miyu-Portable.html -DestinationPath Miyu-Windows.zip -Force
          Get-ChildItem *.zip

      - name: SHA256
        if: success()
        run: |
          (Get-FileHash Miyu.exe -Algorithm SHA256).Hash + "  Miyu.exe" | Out-File SHA256SUMS.txt
          (Get-FileHash Miyu-Windows.zip -Algorithm SHA256).Hash + "  Miyu-Windows.zip" | Out-File -Append SHA256SUMS.txt
          (Get-FileHash deliverables/Miyu-Portable.html -Algorithm SHA256).Hash + "  Miyu-Portable.html" | Out-File -Append SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Miyu-Windows
          path: |
            Miyu.exe
            Miyu-Windows.zip
            SHA256SUMS.txt
            deliverables/Miyu-Portable.html

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          files: |
            Miyu.exe
            Miyu-Windows.zip
            SHA256SUMS.txt
            deliverables/Miyu-Portable.html
          tag_name: v1.2.0-windows-${{ github.run_number }}
          name: Miyu Windows Public v1.2.0
          body: |
            Public Windows Release
            - Miyu.exe (WebView2, Go backend, embedded UI)
            - Miyu-Portable.html fallback
            - SHA256 checksums
            - Built from ${{ github.sha }}
            - Native Desktop primary, Portable fallback
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
