name: Private Owner Windows

on:
  workflow_dispatch:

jobs:
  build-owner-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install deps
        run: npm ci

      - name: Build web
        run: npm run build

      - name: Build portable
        run: npm run build:portable

      - name: Go mod tidy
        working-directory: desktop
        run: go mod tidy

      - name: Generate owner hash from secret (no external deps)
        env:
          MIYU_OWNER_PIN: ${{ secrets.MIYU_OWNER_PIN }}
        run: |
          if (-not $env:MIYU_OWNER_PIN) { Write-Error "MIYU_OWNER_PIN secret not set"; exit 1 }
          cd tools
          go run gen-owner-hash.go > ../owner.env
          # Redact for log
          Get-Content ../owner.env | ForEach-Object {
            if ($_ -match "^salt=") { "salt=[REDACTED]" } elseif ($_ -match "^hash=") { "hash=[REDACTED]" } else { $_ }
          }
          cd ..

      - name: Parse owner hash
        id: owner
        run: |
          $content = Get-Content owner.env
          $salt = ($content | Select-String "salt=") -replace "salt=",""
          $hash = ($content | Select-String "hash=") -replace "hash=",""
          echo "salt=$salt" >> $env:GITHUB_OUTPUT
          echo "hash=$hash" >> $env:GITHUB_OUTPUT
          echo "Owner hash generated (redacted)"

      - name: Generate Windows resources
        working-directory: desktop
        run: go run ./resourcegen

      - name: Build Owner Windows EXE
        working-directory: desktop
        env:
          OWNER_SALT: ${{ steps.owner.outputs.salt }}
          OWNER_HASH: ${{ steps.owner.outputs.hash }}
        run: |
          go build -trimpath -ldflags="-s -w -H windowsgui -X main.ownerSalt=$env:OWNER_SALT -X main.ownerHash=$env:OWNER_HASH -X main.ownerBuildID=owner-${{ github.sha }} -X main.AppVersion=1.2.0-owner" -o ../Miyu-Owner.exe .
          if (!(Test-Path ../Miyu-Owner.exe)) { throw "Owner exe not built" }
          Get-FileHash ../Miyu-Owner.exe

      - name: Create Owner ZIP
        run: |
          mkdir owner-deliverables
          Copy-Item Miyu-Owner.exe owner-deliverables/
          Copy-Item deliverables/Miyu-Portable.html owner-deliverables/Owner-Portable.html -ErrorAction SilentlyContinue
          @"
          MIYU OWNER EDITION - PRIVATE
          ============================
          Private Owner build. Do NOT distribute publicly.
          Build ID: owner-${{ github.sha }}
          Version: 1.2.0-owner
          Owner Panel contains: Owner Lab, Experimental Toy Library, Diagnostics, Voice Controls/Full Duplex, Adult Profile Controls, Filter Control, Debug Status, Export settings, Lock Panel, Build ID
          Unlock: Settings & privacy -> Enter PIN from MIYU_OWNER_PIN secret -> 18+ mode -> Private build only
          Security: PBKDF2-SHA256 120k iterations random salt hash only never plaintext PIN public has no hash
          Safety limits never disabled: no sexual content for minors, no self-harm, no dangerous, no illegal, no surveillance, no human claim
          "@ | Out-File owner-deliverables/OWNER-ADMIN-GUIDE.txt

          Compress-Archive -Path owner-deliverables/* -DestinationPath Miyu-Owner-Windows.zip -Force
          Get-FileHash Miyu-Owner-Windows.zip

      - name: Upload Owner artifact (private)
        uses: actions/upload-artifact@v4
        with:
          name: Miyu-Owner-Windows
          path: |
            Miyu-Owner-Windows.zip
            Miyu-Owner.exe
            owner-deliverables/OWNER-ADMIN-GUIDE.txt
          retention-days: 7

      - name: Security note
        run: |
          echo "Owner build completed. Private artifact not public Release."
          echo "Hash not printed in logs."
