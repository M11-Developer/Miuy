name: iOS Validation

# iOS has no free / silent overlay. This workflow validates the SwiftUI companion project and
# proves the platform-limited feature set (PiP, Widgets, Live Activity, Dynamic Island, App
# Intents, Share Sheet, Shortcuts) is really present in source.
#
# It never publishes a fake .ipa. An .ipa is only produced when real Apple signing secrets exist.

on:
  push:
    branches: [ main ]
    paths:
      - 'mobile/ios/**'
      - 'RELEASE-NOTES-1.2.5.md'
      - '.github/workflows/ios-validation.yml'
  workflow_dispatch:

jobs:
  validate-ios:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version || true
          swift --version || true
          uname -a

      - name: Feature coverage checks (PiP / Widgets / Live Activity / Dynamic Island / Intents / Share Sheet / Shortcuts)
        run: |
          set -e
          IOS=mobile/ios
          fail() { echo "::error::$1"; exit 1; }
          ls -R "$IOS"

          grep -rq "AVPictureInPictureController" "$IOS" || grep -rq "PiP" "$IOS" || fail "Picture-in-Picture support missing"
          grep -rq "import WidgetKit" "$IOS" || fail "WidgetKit widget missing"
          grep -rq "ActivityKit" "$IOS" || fail "ActivityKit (Live Activity) missing"
          grep -rq "ActivityConfiguration" "$IOS" || fail "Dynamic Island / Live Activity configuration missing"
          grep -rq "DynamicIsland" "$IOS" || fail "DynamicIsland view missing"
          grep -rq "AppIntent" "$IOS" || fail "App Intents missing"
          grep -rq "AppShortcutsProvider" "$IOS" || fail "Shortcuts integration missing"
          grep -rq "ShareLink\|UIActivityViewController\|share-services" "$IOS" || fail "Share Sheet support missing"
          grep -rq "UNNotificationCategory\|UNUserNotificationCenter" "$IOS" || fail "Interactive notifications missing"
          echo "All required iOS feature surfaces are present."

      - name: Prove there is no fake IPA or hidden binary in the repository
        run: |
          set -e
          if find . -name "*.ipa" -not -path "./.git/*" | grep -q .; then
            echo "::error::An .ipa file is committed to the repository - releases must be built, never faked."
            find . -name "*.ipa" -not -path "./.git/*"
            exit 1
          fi
          if find . -name "*.app" -o -name "*.xcarchive" -not -path "./.git/*" | grep -q .; then
            echo "::error::A prebuilt .app / .xcarchive is committed."
            exit 1
          fi
          if find . -type f -not -path "./.git/*" -exec sh -c 'file -b "$1" | grep -q "Mach-O"' _ {} \; -print | grep -q .; then
            echo "::error::A prebuilt Mach-O binary is committed."
            exit 1
          fi
          echo "No fake IPA, no prebuilt app bundle, no committed Mach-O binary."

      - name: Swift syntax check (every source file must parse)
        run: |
          set -e
          STATUS=0
          while IFS= read -r f; do
            echo "parsing $f"
            xcrun swiftc -parse "$f" || STATUS=1
          done < <(find mobile/ios -name "*.swift")
          if [ "$STATUS" -ne 0 ]; then
            echo "::error::Swift sources contain syntax errors"
            exit 1
          fi
          echo "All Swift sources parse cleanly."

      - name: Attempt a real compile with XcodeGen + xcodebuild (no signing)
        id: compile
        continue-on-error: true
        run: |
          set -x
          brew install xcodegen || true
          cd mobile/ios
          if [ -f project.yml ]; then
            xcodegen generate
            xcodebuild -list -project MiyuCompanion.xcodeproj
            xcodebuild -project MiyuCompanion.xcodeproj -scheme MiyuCompanion \
              -destination 'generic/platform=iOS' -sdk iphoneos \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
              build | tail -n 60
            echo "compile=ok" >> "$GITHUB_OUTPUT"
          else
            echo "compile=no-project-spec" >> "$GITHUB_OUTPUT"
          fi

      - name: Real signed IPA only if Apple signing secrets exist (never faked)
        id: ipa
        env:
          APPLE_CERT_B64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PROFILE_B64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -z "${APPLE_CERT_B64}" ] || [ -z "${APPLE_PROFILE_B64}" ]; then
            echo "No Apple signing secrets configured - an installable IPA cannot be produced."
            echo "A public GitHub runner cannot sign for your Apple Developer team, so this workflow"
            echo "publishes the Xcode project + sources + this validation report instead of a fake .ipa."
            echo "ipa=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Signing secrets found - building a real IPA."
          cd mobile/ios
          echo "$APPLE_CERT_B64" | base64 -d > /tmp/cert.p12
          echo "$APPLE_PROFILE_B64" | base64 -d > /tmp/profile.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp /tmp/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/ || true
          KEYCHAIN=/tmp/miyu-signing.keychain-db
          KEYCHAIN_PASS=$(openssl rand -hex 16)
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 1800 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security import /tmp/cert.p12 -k "$KEYCHAIN" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASS" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          xcodegen generate 2>/dev/null || true
          xcodebuild -project MiyuCompanion.xcodeproj -scheme MiyuCompanion \
            -destination 'generic/platform=iOS' -sdk iphoneos \
            -archivePath /tmp/Miyu.xcarchive archive | tail -n 40
          cat > /tmp/exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>development</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>compileBitcode</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath /tmp/Miyu.xcarchive \
            -exportOptionsPlist /tmp/exportOptions.plist -exportPath /tmp/ipa | tail -n 40
          mkdir -p ../../deliverables-ios
          cp /tmp/ipa/*.ipa ../../deliverables-ios/ || true
          ls -l ../../deliverables-ios || true
          echo "ipa=built" >> "$GITHUB_OUTPUT"

      - name: Package iOS sources and validation report
        run: |
          mkdir -p deliverables-ios
          if [ -f mobile/ios/project.yml ]; then
            cp mobile/ios/project.yml deliverables-ios/project.yml
          fi
          (cd mobile/ios && zip -qr "$GITHUB_WORKSPACE/deliverables-ios/Miyu-iOS-Xcode-Sources-1.2.5.zip" . -x '*.xcodeproj/*' -x '*DerivedData*')
          cp README-iOS.md deliverables-ios/ 2>/dev/null || true
          cp RELEASE-NOTES-1.2.5.md deliverables-ios/ 2>/dev/null || true
          cp LICENSE deliverables-ios/LICENSE.txt 2>/dev/null || true
          {
            echo "Miyu iOS validation report"
            echo "=========================="
            echo "runner          : macos-latest"
            echo "commit          : ${{ github.sha }}"
            echo "version         : 1.2.5"
            echo "syntax check    : all Swift sources parsed with 'xcrun swiftc -parse'"
            echo "feature checks  : PiP / WidgetKit / ActivityKit / DynamicIsland / AppIntent / AppShortcutsProvider / Share Sheet / notifications"
            echo "compile attempt : ${{ steps.compile.outputs.compile }}"
            echo "signed IPA      : ${{ steps.ipa.outputs.ipa }} (an IPA needs real Apple Developer signing secrets)"
            echo
            echo "iOS cannot host a free floating overlay like Android. Miyu uses only Apple-approved surfaces:"
            echo "  - Picture in Picture for a small floating Miyu window while using other apps"
            echo "  - Home Screen and Lock Screen widgets for mood / toy / focus state"
            echo "  - Live Activity + Dynamic Island for focus sessions and toy moments"
            echo "  - App Intents and Shortcuts ('افتحي ميو', 'شغلي وقت التركيز', 'امسكي عربية لعبة')"
            echo "  - Share Sheet and interactive notifications"
            echo "To ship an installable IPA, add APPLE_CERTIFICATE_BASE64, APPLE_CERTIFICATE_PASSWORD,"
            echo "APPLE_TEAM_ID and APPLE_PROVISIONING_PROFILE_BASE64 as repository secrets."
          } > deliverables-ios/VALIDATION-IOS.txt
          if [ -f deliverables-ios/Miyu-iOS-Xcode-Sources-1.2.5.zip ]; then
            if unzip -l deliverables-ios/Miyu-iOS-Xcode-Sources-1.2.5.zip | grep -q "\.ipa"; then
              echo "::error::Sources archive contains an .ipa - refusing."
              exit 1
            fi
          fi
          cd deliverables-ios && sha256sum * > SHA256SUMS.txt
          ls -l

      - name: Compute release tag
        id: tag
        run: |
          BASE="v1.2.5-ios-${GITHUB_RUN_NUMBER}"
          TAG="$BASE"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "refs/tags/$TAG"; then
            TAG="$BASE-${GITHUB_RUN_ATTEMPT}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Miyu-iOS-Validation
          path: deliverables-ios/
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release v1.2.5 (iOS validation)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Miyu iOS Validation v1.2.5 (${{ steps.tag.outputs.tag }})
          fail_on_unmatched_files: true
          files: |
            deliverables-ios/*
          body: |
            ## Miyu for iOS — v1.2.5 (Xcode project + validation, no fake IPA)

            This release is deliberately honest: **no `.ipa` is published unless Apple signing
            secrets exist in the repository.** A public CI runner cannot sign an app for your
            Apple Developer team, and a fake `.ipa` would be worse than none.

            ### Files
            | File | What it is |
            | --- | --- |
            | `Miyu-iOS-Xcode-Sources-1.2.5.zip` | The complete SwiftUI project sources + `project.yml` (XcodeGen spec that generates a real Xcode project with the app, the widget/Dynamic Island extension and the share extension). |
            | `project.yml` | The Xcode project definition on its own. |
            | `VALIDATION-IOS.txt` | What CI checked: syntax parse of every Swift file, feature-surface checks, compile attempt result, IPA decision and the Apple secret names needed to sign. |
            | `README-iOS.md`, `RELEASE-NOTES-1.2.5.md`, `LICENSE.txt` | Documentation. |
            | `SHA256SUMS.txt` | SHA-256 for every file above. |

            ### Why no IPA
            iOS does not allow a free floating overlay like Android does. Miyu therefore uses only
            Apple-approved surfaces, and each one requires a signed app to test on a device:
            Picture-in-Picture, Home/Lock Screen widgets, Live Activity, Dynamic Island, App Intents,
            Shortcuts, Share Sheet and interactive notifications.

            To produce an installable IPA: add `APPLE_CERTIFICATE_BASE64`,
            `APPLE_CERTIFICATE_PASSWORD`, `APPLE_TEAM_ID` and `APPLE_PROVISIONING_PROFILE_BASE64`
            as repository secrets and re-run the **iOS Validation** workflow — it will then archive
            and export a real IPA instead of skipping.

            ### Build locally on a Mac
            ```bash
            brew install xcodegen
            cd mobile/ios && xcodegen generate && open MiyuCompanion.xcodeproj
            ```
        env:
          GITHUB_TOKEN: ${{ github.token }}
