name: Public Linux Release

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'desktop/**'
      - 'public/**'
      - 'tools/**'
      - 'package.json'
      - '.github/workflows/public-linux-release.yml'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: desktop/go.mod

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config || true
          # Try to install both webkit versions, tolerant
          sudo apt-get install -y libwebkit2gtk-4.0-dev || echo "4.0 not available"
          sudo apt-get install -y libwebkit2gtk-4.1-dev || echo "4.1 not available"
          # Show installed
          pkg-config --modversion gtk+-3.0 || true
          pkg-config --modversion webkit2gtk-4.0 || echo "webkit2gtk-4.0 not found"
          pkg-config --modversion webkit2gtk-4.1 || echo "webkit2gtk-4.1 not found"
          dpkg -l | grep webkit || true
          # If only 4.1 exists, create pkg-config alias for 4.0 -> 4.1 via environment hack
          if pkg-config --exists webkit2gtk-4.1 && ! pkg-config --exists webkit2gtk-4.0; then
            echo "Only 4.1 found, will set PKG_CONFIG to use 4.1 for 4.0 requests"
            # Create a wrapper pc file
            sudo mkdir -p /usr/local/lib/pkgconfig
            sudo sh -c 'cat > /usr/local/lib/pkgconfig/webkit2gtk-4.0.pc <<EOF
          Name: WebKitGTK 4.0 alias to 4.1
          Description: Alias
          Version: 2.44.0
          Requires: webkit2gtk-4.1
          EOF'
            echo "PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV
          fi

      - name: npm ci
        run: npm ci

      - name: Build web
        run: npm run build

      - name: Build portable
        run: npm run build:portable

      - name: Go mod tidy
        working-directory: desktop
        run: |
          go env
          go mod tidy -v
          cat go.mod
          ls -lh

      - name: Build Linux binary amd64
        working-directory: desktop
        run: |
          set -x
          # Print pkg-config
          pkg-config --cflags --libs gtk+-3.0 webkit2gtk-4.0 2>&1 | head -n 20 || pkg-config --cflags --libs gtk+-3.0 webkit2gtk-4.1 2>&1 | head -n 20 || true
          # Build with verbose, capture log
          go build -x -trimpath -ldflags="-s -w -X main.ownerBuildID=public-linux-${{ github.sha }} -X main.AppVersion=1.2.0" -o ../Miyu-Linux-x86_64 . 2>&1 | tee build.log
          echo "=== BUILD LOG TAIL ==="
          tail -n 200 build.log
          file ../Miyu-Linux-x86_64
          ls -lh ../Miyu-Linux-x86_64

      - name: Show build log on failure (always)
        if: always()
        working-directory: desktop
        run: |
          echo "=== BUILD LOG FULL (last 500 lines) ==="
          tail -n 500 build.log || echo "no build.log"
          echo "=== GO ENV ==="
          go env

      - name: Create AppDir
        if: success()
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          cp Miyu-Linux-x86_64 AppDir/usr/bin/miyu
          cp public/assets/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/miyu.png || echo "icon missing"
          cat > AppDir/usr/share/applications/miyu.desktop <<'EOF'
          [Desktop Entry]
          Name=Miyu
          Comment=A little company, a little magic
          Exec=miyu
          Icon=miyu
          Type=Application
          Categories=Utility;
          Terminal=false
          EOF
          cat > AppDir/AppRun <<'EOF'
          #!/bin/bash
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          exec "$HERE/usr/bin/miyu" "$@"
          EOF
          chmod +x AppDir/AppRun
          cp AppDir/usr/share/applications/miyu.desktop AppDir/miyu.desktop
          cp AppDir/usr/share/icons/hicolor/256x256/apps/miyu.png AppDir/miyu.png || true

      - name: Build AppImage
        if: success()
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ./appimagetool AppDir Miyu-Linux-x86_64.AppImage || sudo ./appimagetool AppDir Miyu-Linux-x86_64.AppImage || cp Miyu-Linux-x86_64 Miyu-Linux-x86_64.AppImage
          ls -lh *.AppImage || true

      - name: Build deb
        if: success()
        run: |
          mkdir -p deb/DEBIAN deb/usr/bin deb/usr/share/applications deb/usr/share/icons/hicolor/256x256/apps deb/usr/share/doc/miyu
          cp Miyu-Linux-x86_64 deb/usr/bin/miyu
          chmod +x deb/usr/bin/miyu
          cp AppDir/usr/share/applications/miyu.desktop deb/usr/share/applications/ || true
          cp AppDir/usr/share/icons/hicolor/256x256/apps/miyu.png deb/usr/share/icons/hicolor/256x256/apps/ || true
          cat > deb/DEBIAN/control <<EOF
          Package: miyu
          Version: 1.2.0
          Section: utils
          Priority: optional
          Architecture: amd64
          Depends: libgtk-3-0, libwebkit2gtk-4.0-0 | libwebkit2gtk-4.1-0
          Maintainer: Miyu Studio <miyu@example.com>
          Description: Miyu — a little company, a little magic
           Native Linux, not just Portable HTML.
          EOF
          echo "Copyright 2026 Miyu Studio" > deb/usr/share/doc/miyu/copyright
          dpkg-deb --build deb Miyu-Linux-x86_64.deb
          ls -lh *.deb

      - name: SHA256
        if: success()
        run: |
          sha256sum Miyu-Linux-x86_64 Miyu-Linux-x86_64.AppImage Miyu-Linux-x86_64.deb deliverables/Miyu-Portable.html > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Miyu-Linux
          path: |
            Miyu-Linux-x86_64
            Miyu-Linux-x86_64.AppImage
            Miyu-Linux-x86_64.deb
            SHA256SUMS.txt

      - name: Release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          files: |
            Miyu-Linux-x86_64.AppImage
            Miyu-Linux-x86_64.deb
            SHA256SUMS.txt
            deliverables/Miyu-Portable.html
          tag_name: v1.2.0-linux-${{ github.run_number }}
          name: Miyu Linux Public v1.2.0
          body: |
            Public Linux Release
            - AppImage and deb
            - Native Linux, not just Portable HTML
            - Built from ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
