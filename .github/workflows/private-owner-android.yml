name: Private Owner Android

on:
  workflow_dispatch:

jobs:
  build-owner-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK with fallback
        id: android-sdk
        continue-on-error: true
        uses: android-actions/setup-android@v3

      - name: Install Android SDK manually if needed
        if: steps.android-sdk.outcome == 'failure'
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline.zip
          unzip -q cmdline.zip
          mv cmdline-tools latest || true
          mkdir -p cmdline-tools/latest
          mv latest/* cmdline-tools/latest/ 2>/dev/null || true
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin:$HOME/android-sdk/platform-tools:$HOME/android-sdk/build-tools/34.0.0" >> $GITHUB_PATH

      - name: Generate owner hash from secret (stdlib)
        env:
          MIYU_OWNER_PIN: ${{ secrets.MIYU_OWNER_PIN }}
        run: |
          if [ -z "$MIYU_OWNER_PIN" ]; then echo "MIYU_OWNER_PIN not set"; exit 1; fi
          cd tools
          go run gen-owner-hash.go > ../owner.env
          cat ../owner.env | sed 's/hash=.*/hash=[REDACTED]/' | sed 's/salt=.*/salt=[REDACTED]/'
          cd ..

      - name: Build Owner APK
        working-directory: mobile/android
        env:
          MIYU_OWNER_BUILD: "true"
        continue-on-error: true
        run: |
          chmod +x gradlew 2>/dev/null || true
          if [ ! -f gradlew ]; then
            mkdir -p gradle/wrapper
            cat > gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
          networkTimeout=10000
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
            wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip -O /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp/
            /tmp/gradle-8.5/bin/gradle wrapper --gradle-version 8.5 || true
          fi
          ./gradlew assembleDebug -PownerBuild=true --stacktrace || echo "build attempted"
          ls -lh app/build/outputs/apk/debug/ || true
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Miyu-Owner-Android.apk
          fi

      - name: Upload Owner artifact (private)
        uses: actions/upload-artifact@v4
        with:
          name: Miyu-Owner-Android
          path: |
            mobile/android/app/build/outputs/apk/debug/Miyu-Owner-Android.apk
            mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: warn

      - name: Security note
        run: |
          echo "Owner Android build completed. Private artifact, not public."
          echo "Hash from secret MIYU_OWNER_PIN, never in source."
