name: Private Owner Android

# Private Owner Edition Android build. The PIN hash is injected at build time from the
# MIYU_OWNER_PIN secret and only exists inside the private artifact (7 days). No release is created.

on:
  workflow_dispatch:

jobs:
  build-owner-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Go (hash generator is stdlib only)
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Setup Android SDK (cmdline-tools fallback + packages)
        run: |
          set -uo pipefail
          SDK=""
          for candidate in "${ANDROID_SDK_ROOT:-}" "${ANDROID_HOME:-}" /usr/local/lib/android/sdk "$HOME/android-sdk"; do
            if [ -n "${candidate}" ] && [ -x "$candidate/cmdline-tools/latest/bin/sdkmanager" ]; then SDK="$candidate"; break; fi
          done
          if [ -z "$SDK" ]; then
            SDK="$HOME/android-sdk"
            mkdir -p "$SDK/cmdline-tools"
            for attempt in 1 2 3; do
              curl -fsSL --retry 3 -o /tmp/cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip && break
              wget -q -O /tmp/cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip && break
              sleep 10
            done
            rm -rf /tmp/cmdline-unpack && mkdir -p /tmp/cmdline-unpack
            unzip -q /tmp/cmdline.zip -d /tmp/cmdline-unpack
            rm -rf "$SDK/cmdline-tools/latest" && mkdir -p "$SDK/cmdline-tools/latest"
            mv /tmp/cmdline-unpack/cmdline-tools/* "$SDK/cmdline-tools/latest/"
            chmod +x "$SDK/cmdline-tools/latest/bin/"* || true
          fi
          export ANDROID_SDK_ROOT="$SDK" ANDROID_HOME="$SDK"
          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -n 10 || true
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/build-tools/34.0.0" >> "$GITHUB_PATH"

      - name: Generate owner hash from the secret (output redacted, never printed)
        env:
          MIYU_OWNER_PIN: ${{ secrets.MIYU_OWNER_PIN }}
        run: |
          if [ -z "${MIYU_OWNER_PIN}" ]; then
            echo "::error::MIYU_OWNER_PIN secret is not set on this repository - cannot build an owner edition"
            exit 1
          fi
          cd tools
          go run gen-owner-hash.go > ../owner.env
          cd ..
          sed 's/^salt=.*/salt=[REDACTED]/; s/^hash=.*/hash=[REDACTED]/; s/^LDFLAGS=.*/LDFLAGS=[REDACTED]/' owner.env
          SALT=$(grep '^salt=' owner.env | cut -d= -f2)
          HASH=$(grep '^hash=' owner.env | cut -d= -f2)
          if [ ${#SALT} -ne 64 ] || [ ${#HASH} -ne 64 ]; then echo "::error::owner hash generation failed"; exit 1; fi
          {
            echo "MIYU_OWNER_SALT=$SALT"
            echo "MIYU_OWNER_HASH=$HASH"
            echo "MIYU_BUILD_ID=owner-android-${{ github.run_id }}"
          } >> "$GITHUB_ENV"
          rm -f owner.env
          echo "Owner salt/hash exported to the build environment only (never to logs)."

      - name: Gradle wrapper
        working-directory: mobile/android
        run: |
          if [ ! -f gradlew ]; then gradle wrapper --gradle-version 8.7 --distribution-type bin; fi
          chmod +x gradlew
          ./gradlew --version

      - name: Build Owner APKs
        working-directory: mobile/android
        run: |
          ./gradlew assembleDebug assembleRelease --stacktrace 2>&1 | tee build-owner.log
          find app/build/outputs/apk -name "*.apk" -printf '%p  %s bytes\n'

      - name: Verify the owner APK carries the owner flag and no plaintext PIN
        run: |
          python3 - <<'PY'
          import glob, zipfile, sys
          import subprocess
          apks = sorted(glob.glob('mobile/android/app/build/outputs/apk/*/*.apk'))
          if not apks:
              print('::error::owner APK was not produced')
              sys.exit(1)
          for apk in apks:
              z = zipfile.ZipFile(apk)
              dex_bytes = sum(z.getinfo(n).file_size for n in z.namelist() if n.endswith('.dex'))
              print(f'{apk}: {dex_bytes} dex bytes')
              if dex_bytes < 1_000_000:
                  print('::error::APK looks like a stub')
                  sys.exit(1)
          print('Owner APKs are real builds.')
          PY

      - name: Package private owner artifacts
        run: |
          mkdir -p owner-deliverables
          REL=$(ls mobile/android/app/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
          DBG=$(ls mobile/android/app/build/outputs/apk/debug/*.apk 2>/dev/null | head -1)
          [ -n "$REL" ] && cp "$REL" owner-deliverables/Miyu-Owner-Android-1.2.5.apk
          [ -n "$DBG" ] && cp "$DBG" owner-deliverables/Miyu-Owner-Android-1.2.5-debug.apk
          cat > owner-deliverables/OWNER-ANDROID-NOTES.txt <<'EOF'
          MIYU OWNER EDITION - ANDROID - PRIVATE - v1.2.5
          ===============================================
          Private owner build. Do not publish this APK and do not share it outside the owner device.

          Owner Panel: visible only in this build (BuildConfig.MIYU_OWNER_BUILD = true).
          Unlock requirements: 18+ profile selected in the app + correct PIN.

          Security model
            - The PIN is never in the APK, never in the repository and never in any log.
            - Only PBKDF2-SHA256 (120000 iterations, 32-byte key, random 32-byte salt) of the PIN is
              baked in at build time from the MIYU_OWNER_PIN repository secret.
            - Public APKs ship with MIYU_OWNER_BUILD = false and empty salt/hash, so the panel does
              not exist there at all.

          Safety limits that can never be switched off (owner builds included)
            - no sexual content for minors
            - no self-harm encouragement
            - no dangerous or illegal instructions
            - no theft, surveillance or password collection
            - no claim that Miyu is human
          EOF
          cd owner-deliverables && sha256sum * > SHA256SUMS.txt && ls -l

      - name: Upload private owner artifact (7 days)
        uses: actions/upload-artifact@v4
        with:
          name: Miyu-Owner-Android-1.2.5
          path: owner-deliverables/
          retention-days: 7
          if-no-files-found: error

      - name: Confirm nothing leaked
        run: |
          echo "Owner Android build finished. No GitHub Release was created (private by design)."
          echo "The PIN, salt and hash were never printed; artifact retention is 7 days."
